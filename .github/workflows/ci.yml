name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the previous, still-running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: test, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # A date-only DTSTART once shifted one day earlier for any runtime east of
      # UTC, and this job runs in UTC, so the suite passed while the bug was
      # real. Running it again from the other side of the line is the guard.
      - name: Test east of UTC
        run: npm test
        env:
          TZ: Pacific/Auckland

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
