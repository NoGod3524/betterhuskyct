name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact commit or tag to verify before a release
        type: string
        required: false
    outputs:
      verified_sha:
        description: Commit that passed all checks
        value: ${{ jobs.verify.outputs.sha }}

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the previous, still-running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: test, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Record the checked revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # A date-only DTSTART once shifted one day earlier for any runtime east of
      # UTC, and this job runs in UTC, so the suite passed while the bug was
      # real. Running it again from the other side of the line is the guard.
      - name: Test east of UTC
        run: npm test
        env:
          TZ: Pacific/Auckland

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
