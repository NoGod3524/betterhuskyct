name: Publish the extension to Edge

# A release is tagged vX.Y.Z. If the helper's version has not been sent yet, the extension is
# built, uploaded over the draft in Microsoft Edge Add-ons, and submitted for review, and the
# version is remembered as a tag, edge/X.Y.Z. A release that did not move the helper changes
# nothing in the store. Run by hand to send the current helper whatever the tags say.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Write, to leave the edge/X.Y.Z tag that says a version was sent.
permissions:
  contents: write

# Two submissions at once would race for the same draft.
concurrency:
  group: publish-edge
  cancel-in-progress: false

jobs:
  publish:
    name: upload and submit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Has this helper version been sent?
        id: moved
        run: |
          current=$(grep -m1 '^// @version' tools/huskyct-helper/huskyct-helper.user.js | awk '{print $3}')
          echo "version=$current" >> "$GITHUB_OUTPUT"
          echo "note=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Run by hand: sending $current."
            echo "send=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/edge/$current" > /dev/null; then
            echo "Helper $current was sent before (tag edge/$current), so the store is left as it is."
            echo "send=false" >> "$GITHUB_OUTPUT"
          else
            echo "Helper $current has not been sent."
            echo "send=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.moved.outputs.send == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.moved.outputs.send == 'true'
        run: npm ci

      - name: Build the extension
        if: steps.moved.outputs.send == 'true'
        run: node scripts/build-extension.mjs

      - name: Show the package's checksum
        if: steps.moved.outputs.send == 'true'
        # The same bytes as the release's package for this tag: they can be matched by this line.
        run: sha256sum public/betterhuskyct-extension.zip

      - name: Upload and submit
        if: steps.moved.outputs.send == 'true'
        run: node scripts/publish-edge.ts
        env:
          # Partner Center, Microsoft Edge, Publish API. The product id is the extension's, in its address.
          EDGE_PRODUCT_ID: 765d310d-eb89-4c3c-af8d-d031dbc78399
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          RELEASE_NOTE: ${{ steps.moved.outputs.note }}

      # Only after the store took it: a failed run leaves no tag, so the next release tries again.
      - name: Remember that this version was sent
        if: steps.moved.outputs.send == 'true'
        run: |
          git tag "edge/${{ steps.moved.outputs.version }}" || true
          git push origin "edge/${{ steps.moved.outputs.version }}"
