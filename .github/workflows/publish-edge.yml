name: Edge release status and publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      action:
        description: Status never POSTs to Microsoft. Reconcile records fresh Partner Center evidence.
        type: choice
        options: [status, reconcile, publish]
        default: status
      release_tag:
        description: Immutable source release tag (for example v2.1.1)
        required: true
        default: v2.1.1
      evidence:
        description: Reconcile only - JSON state, version, observedAt, reference, optional submissionId. No credentials.
        required: false

permissions:
  contents: write

# Every workflow that can write this product must share this group and journal.
concurrency:
  group: publish-edge
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    name: inspect or resume Edge release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout publishing code
        uses: actions/checkout@v7
      - name: Validate source tag
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected a release tag"; exit 1; }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Checkout exact package source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.tag }}
          path: .release
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install publishing dependencies
        run: npm ci --ignore-scripts
      - name: Build source package and record identity
        id: package
        run: |
          node .release/scripts/build-extension.mjs
          echo "sha=$(git -C .release rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          sha256sum .release/public/betterhuskyct-extension.zip
      - name: Inspect, reconcile or resume
        run: node scripts/publish-edge.ts .release/public/betterhuskyct-extension.zip
        env:
          EDGE_MODE: ${{ inputs.action || 'status' }}
          EDGE_SOURCE_SHA: ${{ steps.package.outputs.sha }}
          EDGE_EVIDENCE: ${{ inputs.evidence }}
          EDGE_PRODUCT_ID: 765d310d-eb89-4c3c-af8d-d031dbc78399
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
