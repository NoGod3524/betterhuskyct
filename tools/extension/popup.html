<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BetterHuskyCT</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>BetterHuskyCT</h1>
  <label><span data-text="language"></span><select id="locale"><option value="en">English</option><option value="zh-CN">简体中文</option></select></label>
  <label class="switch"><input type="checkbox" id="enabled"><span data-text="background"></span></label>
  <p class="hint" data-text="backgroundHint"></p>
  <label class="switch"><input type="checkbox" id="notifications"><span data-text="notifications"></span></label>
  <p class="hint" data-text="notificationHint"></p>
  <fieldset id="kinds"><legend data-text="kinds"></legend></fieldset>
  <p id="status" role="status" aria-live="polite"></p>
  <p id="error" role="alert"></p>
  <button id="run" data-text="run"></button>
  <button id="login" hidden data-text="login"></button>
  <a href="https://betterhuskyct.vercel.app/changes" target="_blank" rel="noreferrer" data-text="open"></a>
  <script type="module" src="popup.js"></script>
</body>
</html>
